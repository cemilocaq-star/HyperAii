name: Build exe + apk
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Capacitor ilə Android layihəsi
        run: |
          mkdir -p mobile/www && cd mobile
          cp -r ../public/. www/
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.badimcanbendeler.game",
            "appName": "Badımcan Bəndələr",
            "webDir": "www",
            "server": { "androidScheme": "http", "cleartext": true }
          }
          EOF
          npx cap add android
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
