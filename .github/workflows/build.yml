name: Build exe + apk

on: workflow_dispatch

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: dist/*.exe

  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: mkdir -p mobile/www && cp -r public/. mobile/www/
      - run: npm init -y
        working-directory: mobile
      - run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
        working-directory: mobile
      - run: echo '{"appId":"com.badimcanbendeler.game","appName":"Badımcan Bəndələr","webDir":"www","server":{"androidScheme":"http","cleartext":true}}' > capacitor.config.json
        working-directory: mobile
      - run: npx cap add android
        working-directory: mobile
      - run: sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml
        working-directory: mobile
      - run: npx cap sync android
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
